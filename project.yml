name: Tonica
options:
  minimumXcodeGenVersion: 2.38.0
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    from: "2.0.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.7.1"
settings:
  base:
    PRODUCT_NAME: Tonica
    PRODUCT_BUNDLE_IDENTIFIER: com.playground.tonica
    MARKETING_VERSION: 1.1.0
    CURRENT_PROJECT_VERSION: 7
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 14.0
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Tonica-Info.plist
targets:
  Tonica:
    type: application
    platform: macOS
    sources:
      - Sources
      - Assets.xcassets
      - path: Resources/Tonica.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playground.tonica
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Tonica.entitlements
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: Tonica
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
schemes:
  Tonica:
    build:
      targets:
        Tonica: all
