name: Build Candidate

"on":
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA to build
        required: true
        type: string
      version:
        description: Marketing version (for example 1.0.4)
        required: true
        type: string
      release_tag:
        description: Stable release tag (for example v1.0.4)
        required: false
        type: string
      debug_diagnostics:
        description: Upload xcresult diagnostics even on success
        required: false
        default: false
        type: boolean

concurrency:
  group: build-candidate-${{ inputs.commit_sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  APP_NAME: Tonica
  SCHEME: Tonica
  PROJECT_PATH: Tonica.xcodeproj
  DERIVED_DATA_PATH: .derived_ci
  APPLE_NOTARY_TIMEOUT: 45m
  NOTARY_KEYCHAIN_PROFILE: tonica-ci-notary
  CANDIDATE_DMG_ARTIFACT_PREFIX: tonica-candidate-dmg
  CANDIDATE_APPCAST_ARTIFACT_PREFIX: tonica-candidate-appcast
  CANDIDATE_METADATA_ARTIFACT_PREFIX: tonica-candidate-metadata

jobs:
  require-release-runner:
    name: Require Release Runner
    runs-on: ubuntu-latest
    outputs:
      runner_labels_json: ${{ steps.runner.outputs.runner_labels_json }}
    steps:
      - name: Require explicit self-hosted release runner
        id: runner
        shell: bash
        run: |
          set -euo pipefail
          RUNNER_LABELS_JSON='${{ vars.RELEASE_RUNNER_LABELS_JSON }}'
          [[ -n "${RUNNER_LABELS_JSON}" ]] || {
            echo "Missing RELEASE_RUNNER_LABELS_JSON. Refusing to fall back to GitHub-hosted macOS." >&2
            exit 1
          }

          echo "runner_labels_json=${RUNNER_LABELS_JSON}" >> "$GITHUB_OUTPUT"

          {
            echo "## Release Runner"
            echo ""
            echo "- Runner labels: \`${RUNNER_LABELS_JSON}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  resolve-candidate:
    name: Resolve Candidate
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      version: ${{ steps.resolve.outputs.version }}
      build_number: ${{ steps.resolve.outputs.build_number }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      dmg_artifact_name: ${{ steps.resolve.outputs.dmg_artifact_name }}
      appcast_artifact_name: ${{ steps.resolve.outputs.appcast_artifact_name }}
      metadata_artifact_name: ${{ steps.resolve.outputs.metadata_artifact_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve canonical candidate identity
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          COMMIT_SHA="${{ inputs.commit_sha }}"
          VERSION="${{ inputs.version }}"
          RELEASE_TAG="${{ inputs.release_tag }}"

          [[ -n "${COMMIT_SHA}" ]] || { echo "commit_sha is required." >&2; exit 1; }
          [[ -n "${VERSION}" ]] || { echo "version is required." >&2; exit 1; }
          git rev-parse --verify "${COMMIT_SHA}^{commit}" >/dev/null
          git checkout --detach "${COMMIT_SHA}"

          PROJECT_VERSION="$(grep -m1 'MARKETING_VERSION' Tonica.xcodeproj/project.pbxproj | sed 's/.*MARKETING_VERSION = //; s/;//; s/[[:space:]]//g')"
          BUILD_NUMBER="$(grep -m1 'CURRENT_PROJECT_VERSION' Tonica.xcodeproj/project.pbxproj | sed 's/.*CURRENT_PROJECT_VERSION = //; s/;//; s/[[:space:]]//g')"
          [[ "${VERSION}" == "${PROJECT_VERSION}" ]] || {
            echo "Requested version ${VERSION} does not match commit ${COMMIT_SHA} project version ${PROJECT_VERSION}." >&2
            exit 1
          }

          if [[ -z "${RELEASE_TAG}" ]]; then
            RELEASE_TAG="v${VERSION}"
          fi
          [[ "${RELEASE_TAG}" == "v${VERSION}" ]] || {
            echo "release_tag must match version exactly (expected v${VERSION})." >&2
            exit 1
          }

          SHORT_SHA="$(git rev-parse --short=12 "${COMMIT_SHA}")"

          {
            echo "commit_sha=${COMMIT_SHA}"
            echo "short_sha=${SHORT_SHA}"
            echo "version=${VERSION}"
            echo "build_number=${BUILD_NUMBER}"
            echo "release_tag=${RELEASE_TAG}"
            echo "dmg_artifact_name=${CANDIDATE_DMG_ARTIFACT_PREFIX}-${VERSION}-${SHORT_SHA}"
            echo "appcast_artifact_name=${CANDIDATE_APPCAST_ARTIFACT_PREFIX}-${VERSION}-${SHORT_SHA}"
            echo "metadata_artifact_name=${CANDIDATE_METADATA_ARTIFACT_PREFIX}-${VERSION}-${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"

  build-candidate:
    name: Build Candidate
    needs:
      - require-release-runner
      - resolve-candidate
    runs-on: ${{ fromJSON(needs.require-release-runner.outputs.runner_labels_json) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-candidate.outputs.commit_sha }}

      - name: Select configured Xcode
        id: xcode
        shell: bash
        run: |
          set -euo pipefail
          RAW_CANDIDATES=()
          while IFS= read -r candidate; do
            RAW_CANDIDATES+=("$candidate")
          done < <(
            {
              xcode-select -p 2>/dev/null || true
              printf '%s\n' "/Applications/Xcode.app/Contents/Developer"
              printf '%s\n' "/Applications/Xcode-beta.app/Contents/Developer"
              find /Applications "$HOME/Applications" -maxdepth 2 -type d -name 'Xcode*.app' 2>/dev/null \
                | sed 's#$#/Contents/Developer#'
            } | awk 'NF && !seen[$0]++'
          )

          for candidate in "${RAW_CANDIDATES[@]}"; do
            [[ -d "$candidate" ]] || continue
            if VERSION_OUTPUT="$(DEVELOPER_DIR="$candidate" xcodebuild -version 2>/dev/null)"; then
              echo "Using Xcode at: $candidate"
              echo "$VERSION_OUTPUT"
              echo "DEVELOPER_DIR=$candidate" >> "$GITHUB_ENV"
              echo "version<<EOF" >> "$GITHUB_OUTPUT"
              echo "$VERSION_OUTPUT" >> "$GITHUB_OUTPUT"
              echo "EOF" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "Could not find a usable Xcode installation." >&2
          exit 1

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v xcodegen >/dev/null 2>&1; then
            command -v brew >/dev/null 2>&1 || {
              echo "Homebrew is required to install xcodegen on the release runner." >&2
              exit 1
            }
            brew install xcodegen
          fi
          dirname "$(command -v xcodegen)" >> "$GITHUB_PATH"

      - name: Generate project
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          xcodegen generate

      - name: Import Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/ci-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/developer_id.p12"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          USER_KEYCHAINS=()
          while IFS= read -r keychain; do
            USER_KEYCHAINS+=("$(printf '%s' "$keychain" | sed 's/^[[:space:]]*\"//; s/\"$//')")
          done < <(security list-keychains -d user)

          security list-keychains -d user -s "$KEYCHAIN_PATH" "${USER_KEYCHAINS[@]}"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Configure notarytool credentials
        env:
          APPLE_NOTARY_API_KEY_P8: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_API_KEY_P8" > "$API_KEY_PATH"

          store_args=(
            store-credentials
            "$NOTARY_KEYCHAIN_PROFILE"
            --key "$API_KEY_PATH"
            --key-id "$APPLE_NOTARY_KEY_ID"
            --keychain "$KEYCHAIN_PATH"
          )

          if [[ -n "${APPLE_NOTARY_ISSUER_ID:-}" ]]; then
            store_args+=(--issuer "$APPLE_NOTARY_ISSUER_ID")
          fi

          xcrun notarytool "${store_args[@]}"

          echo "APPLE_NOTARY_KEYCHAIN_PROFILE=$NOTARY_KEYCHAIN_PROFILE" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Archive app
        id: archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          SECONDS=0
          ARCHIVE_PATH="$RUNNER_TEMP/${APP_NAME}.xcarchive"
          XCRESULT_PATH="$RUNNER_TEMP/${APP_NAME}Archive.xcresult"

          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"
          echo "XCRESULT_PATH=$XCRESULT_PATH" >> "$GITHUB_ENV"

          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -resultBundlePath "$XCRESULT_PATH" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options runtime"

          echo "seconds=$SECONDS" >> "$GITHUB_OUTPUT"

      - name: Export signed app
        id: export
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          SECONDS=0
          EXPORT_PATH="$RUNNER_TEMP/export"
          echo "EXPORT_PATH=$EXPORT_PATH" >> "$GITHUB_ENV"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>developer-id</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>${SIGN_IDENTITY}</string>
              <key>stripSwiftSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          APP_PATH="${EXPORT_PATH}/${APP_NAME}.app"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          test -f "${APP_PATH}/Contents/MacOS/${APP_NAME}"
          chmod +x ./scripts/ensure_app_icon.sh
          ./scripts/ensure_app_icon.sh "$APP_PATH"

          codesign --force --deep --sign "$SIGN_IDENTITY" --timestamp --options runtime \
            --preserve-metadata=entitlements "$APP_PATH"

          echo "seconds=$SECONDS" >> "$GITHUB_OUTPUT"

      - name: Verify app signature
        shell: bash
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Notarize app bundle
        id: notarize_app
        shell: bash
        run: |
          set -euo pipefail
          SECONDS=0
          NOTARIZE_ZIP="$RUNNER_TEMP/${APP_NAME}-${{ needs.resolve-candidate.outputs.version }}-notarize.zip"
          ditto -c -k --keepParent "$APP_PATH" "$NOTARIZE_ZIP"

          chmod +x ./scripts/notarize_archive.sh
          ./scripts/notarize_archive.sh "$NOTARIZE_ZIP"

          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type exec -vv "$APP_PATH"

          echo "seconds=$SECONDS" >> "$GITHUB_OUTPUT"

      - name: Create DMG
        id: create_dmg
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          SECONDS=0
          chmod +x ./scripts/build_dmg.sh
          DMG_PATH="$RUNNER_TEMP/Tonica.dmg"
          ./scripts/build_dmg.sh "$APP_PATH" "$DMG_PATH" "$APP_NAME"
          codesign --force --sign "$SIGN_IDENTITY" --timestamp --verbose=2 "$DMG_PATH"
          codesign --verify --verbose=2 "$DMG_PATH"

          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"
          echo "seconds=$SECONDS" >> "$GITHUB_OUTPUT"

      - name: Notarize DMG
        id: notarize_dmg
        shell: bash
        run: |
          set -euo pipefail
          SECONDS=0
          chmod +x ./scripts/notarize_archive.sh
          ./scripts/notarize_archive.sh "$DMG_PATH"

          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature -vv "$DMG_PATH"

          echo "seconds=$SECONDS" >> "$GITHUB_OUTPUT"

      - name: Generate appcast candidate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/generate_appcast.sh
          APPCAST_PATH="$RUNNER_TEMP/appcast.xml"
          ./scripts/generate_appcast.sh \
            "$DMG_PATH" \
            "$APPCAST_PATH" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ needs.resolve-candidate.outputs.release_tag }}/" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${{ needs.resolve-candidate.outputs.release_tag }}" \
            "https://artoshi.work/tonica"
          echo "APPCAST_PATH=$APPCAST_PATH" >> "$GITHUB_ENV"

      - name: Emit candidate metadata
        shell: bash
        run: |
          set -euo pipefail
          METADATA_PATH="$RUNNER_TEMP/release-metadata.json"
          DMG_SHA256="$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')"
          DMG_SIZE="$(stat -f '%z' "$DMG_PATH")"
          jq -n \
            --arg release_tag "${{ needs.resolve-candidate.outputs.release_tag }}" \
            --arg version "${{ needs.resolve-candidate.outputs.version }}" \
            --arg build_number "${{ needs.resolve-candidate.outputs.build_number }}" \
            --arg commit_sha "${{ needs.resolve-candidate.outputs.commit_sha }}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg xcode "${{ steps.xcode.outputs.version }}" \
            --arg dmg_sha256 "$DMG_SHA256" \
            --argjson dmg_size "$DMG_SIZE" \
            --argjson archive_seconds "${{ steps.archive.outputs.seconds }}" \
            --argjson export_seconds "${{ steps.export.outputs.seconds }}" \
            --argjson notarize_app_seconds "${{ steps.notarize_app.outputs.seconds }}" \
            --argjson create_dmg_seconds "${{ steps.create_dmg.outputs.seconds }}" \
            --argjson notarize_dmg_seconds "${{ steps.notarize_dmg.outputs.seconds }}" \
            '{
              release_tag: $release_tag,
              version: $version,
              build_number: $build_number,
              commit_sha: $commit_sha,
              run_id: $run_id,
              xcode: $xcode,
              dmg_sha256: $dmg_sha256,
              dmg_size: $dmg_size,
              timings: {
                archive_seconds: $archive_seconds,
                export_seconds: $export_seconds,
                notarize_app_seconds: $notarize_app_seconds,
                create_dmg_seconds: $create_dmg_seconds,
                notarize_dmg_seconds: $notarize_dmg_seconds
              }
            }' > "$METADATA_PATH"
          echo "METADATA_PATH=$METADATA_PATH" >> "$GITHUB_ENV"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.resolve-candidate.outputs.dmg_artifact_name }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ env.DMG_PATH }}

      - name: Upload appcast artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.resolve-candidate.outputs.appcast_artifact_name }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ env.APPCAST_PATH }}

      - name: Upload release metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.resolve-candidate.outputs.metadata_artifact_name }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ env.METADATA_PATH }}

      - name: Upload build diagnostics
        if: ${{ (failure() || inputs.debug_diagnostics) && env.XCRESULT_PATH != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: tonica-build-diagnostics-${{ needs.resolve-candidate.outputs.version }}-${{ needs.resolve-candidate.outputs.short_sha }}
          retention-days: 7
          if-no-files-found: ignore
          path: ${{ env.XCRESULT_PATH }}

      - name: Candidate summary
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Candidate Built"
            echo ""
            echo "- Commit: \`${{ needs.resolve-candidate.outputs.commit_sha }}\`"
            echo "- Version: \`${{ needs.resolve-candidate.outputs.version }}\`"
            echo "- Release tag: \`${{ needs.resolve-candidate.outputs.release_tag }}\`"
            echo "- DMG artifact: \`${{ needs.resolve-candidate.outputs.dmg_artifact_name }}\`"
            echo "- Appcast artifact: \`${{ needs.resolve-candidate.outputs.appcast_artifact_name }}\`"
            echo "- Metadata artifact: \`${{ needs.resolve-candidate.outputs.metadata_artifact_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Recovery summary on build failure
        if: failure()
        shell: bash
        run: |
          {
            echo "## Build Recovery"
            echo ""
            echo "- Failing step: see the red step above in the Build Candidate job."
            echo "- Smallest safe recovery path: fix that build/sign/notarization issue, then rerun this workflow for the same commit/version."
          } >> "$GITHUB_STEP_SUMMARY"
