name: Release

"on":
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag (for example v1.0.4)
        required: true
        type: string
      version:
        description: Marketing version (for example 1.0.4)
        required: true
        type: string
      commit_sha:
        description: Commit SHA for candidate lookup when the tag does not already exist
        required: false
        type: string
      candidate_run_id:
        description: Existing candidate workflow run to promote
        required: false
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: stable-publish
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  SPARKLE_APPCAST_PATH: docs/appcast.xml
  CANDIDATE_DMG_ARTIFACT_PREFIX: tonica-candidate-dmg
  CANDIDATE_APPCAST_ARTIFACT_PREFIX: tonica-candidate-appcast
  CANDIDATE_METADATA_ARTIFACT_PREFIX: tonica-candidate-metadata

jobs:
  require-release-runner:
    name: Require Release Runner
    runs-on: ubuntu-latest
    outputs:
      runner_labels_json: ${{ steps.runner.outputs.runner_labels_json }}
    steps:
      - name: Require explicit self-hosted release runner
        id: runner
        shell: bash
        run: |
          set -euo pipefail
          RUNNER_LABELS_JSON='${{ vars.RELEASE_RUNNER_LABELS_JSON }}'
          [[ -n "${RUNNER_LABELS_JSON}" ]] || {
            echo "Missing RELEASE_RUNNER_LABELS_JSON. Refusing to fall back to GitHub-hosted macOS." >&2
            exit 1
          }

          echo "runner_labels_json=${RUNNER_LABELS_JSON}" >> "$GITHUB_OUTPUT"

  resolve-release:
    name: Resolve Release
    runs-on: ubuntu-latest
    needs: require-release-runner
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      version: ${{ steps.resolve.outputs.version }}
      build_number: ${{ steps.resolve.outputs.build_number }}
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      candidate_run_id: ${{ steps.resolve.outputs.candidate_run_id }}
      dmg_artifact_name: ${{ steps.resolve.outputs.dmg_artifact_name }}
      appcast_artifact_name: ${{ steps.resolve.outputs.appcast_artifact_name }}
      metadata_artifact_name: ${{ steps.resolve.outputs.metadata_artifact_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve canonical stable release identity
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            VERSION="${RELEASE_TAG#v}"
            COMMIT_SHA="${GITHUB_SHA}"
            CANDIDATE_RUN_ID=""
          else
            RELEASE_TAG="${{ inputs.release_tag }}"
            VERSION="${{ inputs.version }}"
            COMMIT_SHA="${{ inputs.commit_sha }}"
            CANDIDATE_RUN_ID="${{ inputs.candidate_run_id }}"
          fi

          [[ -n "${RELEASE_TAG}" ]] || { echo "release_tag is required." >&2; exit 1; }
          [[ -n "${VERSION}" ]] || { echo "version is required." >&2; exit 1; }
          [[ "${RELEASE_TAG}" == "v${VERSION}" ]] || {
            echo "release_tag must exactly match version (expected v${VERSION})." >&2
            exit 1
          }

          if git rev-parse --verify "${RELEASE_TAG}^{commit}" >/dev/null 2>&1; then
            TAG_COMMIT="$(git rev-list -n 1 "${RELEASE_TAG}")"
            if [[ -n "${COMMIT_SHA}" && "${COMMIT_SHA}" != "${TAG_COMMIT}" ]]; then
              echo "commit_sha ${COMMIT_SHA} does not match tag ${RELEASE_TAG} commit ${TAG_COMMIT}." >&2
              exit 1
            fi
            COMMIT_SHA="${TAG_COMMIT}"
          fi

          [[ -n "${COMMIT_SHA}" ]] || {
            echo "commit_sha is required when release_tag is not present locally." >&2
            exit 1
          }

          git rev-parse --verify "${COMMIT_SHA}^{commit}" >/dev/null
          git checkout --detach "${COMMIT_SHA}"

          PROJECT_VERSION="$(grep -m1 'MARKETING_VERSION' Tonica.xcodeproj/project.pbxproj | sed 's/.*MARKETING_VERSION = //; s/;//; s/[[:space:]]//g')"
          BUILD_NUMBER="$(grep -m1 'CURRENT_PROJECT_VERSION' Tonica.xcodeproj/project.pbxproj | sed 's/.*CURRENT_PROJECT_VERSION = //; s/;//; s/[[:space:]]//g')"
          [[ "${VERSION}" == "${PROJECT_VERSION}" ]] || {
            echo "Requested version ${VERSION} does not match commit ${COMMIT_SHA} project version ${PROJECT_VERSION}." >&2
            exit 1
          }

          if [[ -n "${CANDIDATE_RUN_ID}" && ! "${CANDIDATE_RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo "candidate_run_id must be numeric." >&2
            exit 1
          fi

          SHORT_SHA="$(git rev-parse --short=12 "${COMMIT_SHA}")"

          {
            echo "release_tag=${RELEASE_TAG}"
            echo "version=${VERSION}"
            echo "build_number=${BUILD_NUMBER}"
            echo "commit_sha=${COMMIT_SHA}"
            echo "short_sha=${SHORT_SHA}"
            echo "candidate_run_id=${CANDIDATE_RUN_ID}"
            echo "dmg_artifact_name=${CANDIDATE_DMG_ARTIFACT_PREFIX}-${VERSION}-${SHORT_SHA}"
            echo "appcast_artifact_name=${CANDIDATE_APPCAST_ARTIFACT_PREFIX}-${VERSION}-${SHORT_SHA}"
            echo "metadata_artifact_name=${CANDIDATE_METADATA_ARTIFACT_PREFIX}-${VERSION}-${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"

  locate-candidate:
    name: Locate Candidate Artifact
    runs-on: ubuntu-latest
    needs: resolve-release
    outputs:
      candidate_run_id: ${{ steps.locate.outputs.candidate_run_id }}
    steps:
      - name: Locate candidate artifact run
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${{ needs.resolve-release.outputs.candidate_run_id }}" ]]; then
            echo "candidate_run_id=${{ needs.resolve-release.outputs.candidate_run_id }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ARTIFACTS_JSON="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" | jq -s '[.[].artifacts[]]')"

          resolve_run_id() {
            local artifact_name="$1"
            jq -r --arg name "$artifact_name" '
              map(select(.name == $name and .expired == false and .workflow_run.id != null))
              | sort_by(.created_at)
              | last
              | .workflow_run.id // empty
            ' <<<"$ARTIFACTS_JSON"
          }

          DMG_RUN_ID="$(resolve_run_id "${{ needs.resolve-release.outputs.dmg_artifact_name }}")"
          APPCAST_RUN_ID="$(resolve_run_id "${{ needs.resolve-release.outputs.appcast_artifact_name }}")"
          METADATA_RUN_ID="$(resolve_run_id "${{ needs.resolve-release.outputs.metadata_artifact_name }}")"

          [[ -n "${DMG_RUN_ID}" ]] || {
            echo "No candidate artifact found for ${{ needs.resolve-release.outputs.version }} (${{ needs.resolve-release.outputs.commit_sha }})." >&2
            echo "Build the candidate first with .github/workflows/build-candidate.yml, then rerun this release workflow." >&2
            exit 1
          }

          [[ "${DMG_RUN_ID}" == "${APPCAST_RUN_ID}" && "${DMG_RUN_ID}" == "${METADATA_RUN_ID}" ]] || {
            echo "Candidate artifacts do not come from the same workflow run." >&2
            exit 1
          }

          echo "candidate_run_id=${DMG_RUN_ID}" >> "$GITHUB_OUTPUT"

  publish-stable:
    name: Publish Stable
    runs-on: ubuntu-latest
    needs:
      - resolve-release
      - locate-candidate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download promoted candidate artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish-input
          gh run download "${{ needs.locate-candidate.outputs.candidate_run_id }}" \
            -n "${{ needs.resolve-release.outputs.dmg_artifact_name }}" \
            -n "${{ needs.resolve-release.outputs.appcast_artifact_name }}" \
            -n "${{ needs.resolve-release.outputs.metadata_artifact_name }}" \
            -D publish-input

      - name: Resolve promoted files
        id: files
        shell: bash
        run: |
          set -euo pipefail
          DMG_PATH="$(find publish-input -name 'Tonica.dmg' -type f | head -n 1)"
          APPCAST_PATH="$(find publish-input -name 'appcast.xml' -type f | head -n 1)"
          METADATA_PATH="$(find publish-input -name 'release-metadata.json' -type f | head -n 1)"

          [[ -f "$DMG_PATH" ]] || { echo "Missing DMG artifact." >&2; exit 1; }
          [[ -f "$APPCAST_PATH" ]] || { echo "Missing appcast artifact." >&2; exit 1; }
          [[ -f "$METADATA_PATH" ]] || { echo "Missing metadata artifact." >&2; exit 1; }

          METADATA_RELEASE_TAG="$(jq -r '.release_tag' "$METADATA_PATH")"
          METADATA_VERSION="$(jq -r '.version' "$METADATA_PATH")"
          METADATA_COMMIT_SHA="$(jq -r '.commit_sha' "$METADATA_PATH")"

          [[ "$METADATA_RELEASE_TAG" == "${{ needs.resolve-release.outputs.release_tag }}" ]] || {
            echo "Artifact release tag ${METADATA_RELEASE_TAG} does not match requested release tag." >&2
            exit 1
          }
          [[ "$METADATA_VERSION" == "${{ needs.resolve-release.outputs.version }}" ]] || {
            echo "Artifact version ${METADATA_VERSION} does not match requested version." >&2
            exit 1
          }
          [[ "$METADATA_COMMIT_SHA" == "${{ needs.resolve-release.outputs.commit_sha }}" ]] || {
            echo "Artifact commit ${METADATA_COMMIT_SHA} does not match requested commit." >&2
            exit 1
          }

          {
            echo "dmg_path=$DMG_PATH"
            echo "appcast_path=$APPCAST_PATH"
            echo "metadata_path=$METADATA_PATH"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        id: publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SECONDS=0
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES_FILE" <<EOF
          Tonica ${{ needs.resolve-release.outputs.version }}

          Latest direct download:
          https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Tonica.dmg
          EOF

          if gh release view "${{ needs.resolve-release.outputs.release_tag }}" >/dev/null 2>&1; then
            gh release upload "${{ needs.resolve-release.outputs.release_tag }}" "${{ steps.files.outputs.dmg_path }}#Tonica.dmg" --clobber
          else
            gh release create "${{ needs.resolve-release.outputs.release_tag }}" \
              "${{ steps.files.outputs.dmg_path }}#Tonica.dmg" \
              --target "${{ needs.resolve-release.outputs.commit_sha }}" \
              --title "Tonica ${{ needs.resolve-release.outputs.version }}" \
              --notes-file "$NOTES_FILE"
          fi

          echo "seconds=$SECONDS" >> "$GITHUB_OUTPUT"

      - name: Publish Sparkle appcast
        id: publish_appcast
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SECONDS=0
          git fetch origin main
          git checkout -B main origin/main

          mkdir -p "$(dirname "$SPARKLE_APPCAST_PATH")"
          cp "${{ steps.files.outputs.appcast_path }}" "$SPARKLE_APPCAST_PATH"

          if git diff --quiet -- "$SPARKLE_APPCAST_PATH"; then
            echo "Sparkle appcast unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$SPARKLE_APPCAST_PATH"
            git commit -m "Update Sparkle appcast for ${{ needs.resolve-release.outputs.release_tag }}"
            git push origin HEAD:main
          fi

          echo "seconds=$SECONDS" >> "$GITHUB_OUTPUT"

      - name: Verify stable release asset URL
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --head \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ needs.resolve-release.outputs.release_tag }}/Tonica.dmg" \
            >/dev/null
          curl --fail --silent --show-error --location --head \
            "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Tonica.dmg" \
            >/dev/null

      - name: Verify Sparkle appcast URL
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/${SPARKLE_APPCAST_PATH}" \
            >/dev/null

      - name: Publish summary
        shell: bash
        run: |
          set -euo pipefail
          METADATA_PATH="${{ steps.files.outputs.metadata_path }}"
          ARCHIVE_SECONDS="$(jq -r '.timings.archive_seconds' "$METADATA_PATH")"
          EXPORT_SECONDS="$(jq -r '.timings.export_seconds' "$METADATA_PATH")"
          NOTARIZE_APP_SECONDS="$(jq -r '.timings.notarize_app_seconds' "$METADATA_PATH")"
          CREATE_DMG_SECONDS="$(jq -r '.timings.create_dmg_seconds' "$METADATA_PATH")"
          NOTARIZE_DMG_SECONDS="$(jq -r '.timings.notarize_dmg_seconds' "$METADATA_PATH")"
          PUBLISH_RELEASE_SECONDS="${{ steps.publish_release.outputs.seconds }}"
          PUBLISH_APPCAST_SECONDS="${{ steps.publish_appcast.outputs.seconds }}"

          SLOWEST_NAME="archive"
          SLOWEST_SECONDS="$ARCHIVE_SECONDS"
          for pair in \
            "export:$EXPORT_SECONDS" \
            "notarize_app:$NOTARIZE_APP_SECONDS" \
            "create_dmg:$CREATE_DMG_SECONDS" \
            "notarize_dmg:$NOTARIZE_DMG_SECONDS" \
            "publish_release:$PUBLISH_RELEASE_SECONDS" \
            "publish_appcast:$PUBLISH_APPCAST_SECONDS"
          do
            NAME="${pair%%:*}"
            VALUE="${pair##*:}"
            if (( VALUE > SLOWEST_SECONDS )); then
              SLOWEST_NAME="$NAME"
              SLOWEST_SECONDS="$VALUE"
            fi
          done

          NEXT_FIX="candidate promotion is already active; keep candidate artifacts warm for the next stable publish"
          if [[ "$SLOWEST_NAME" == "archive" ]]; then
            NEXT_FIX="reuse persistent workspace, SwiftPM caches, and DerivedData on the release Mac so archive stays incremental"
          elif [[ "$SLOWEST_NAME" == "notarize_app" || "$SLOWEST_NAME" == "notarize_dmg" ]]; then
            NEXT_FIX="treat dual notarization as an experiment and verify whether one stapled notarization pass can be safely dropped"
          fi

          {
            echo "## Release Timings"
            echo ""
            echo "| Phase | Seconds |"
            echo "| --- | ---: |"
            echo "| archive | ${ARCHIVE_SECONDS} |"
            echo "| export | ${EXPORT_SECONDS} |"
            echo "| notarize app | ${NOTARIZE_APP_SECONDS} |"
            echo "| create DMG | ${CREATE_DMG_SECONDS} |"
            echo "| notarize DMG | ${NOTARIZE_DMG_SECONDS} |"
            echo "| publish release | ${PUBLISH_RELEASE_SECONDS} |"
            echo "| publish appcast | ${PUBLISH_APPCAST_SECONDS} |"
            echo ""
            echo "Slowest stage: ${SLOWEST_NAME} (${SLOWEST_SECONDS}s)."
            echo "Smallest safe next improvement: ${NEXT_FIX}."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Recovery summary on publish failure
        if: failure()
        shell: bash
        run: |
          {
            echo "## Publish Recovery"
            echo ""
            echo "- Failing step: see the red step above in the Publish Stable job."
            echo "- Smallest safe recovery path: rerun this workflow for the same release_tag/version after confirming the candidate artifact run id."
          } >> "$GITHUB_STEP_SUMMARY"
