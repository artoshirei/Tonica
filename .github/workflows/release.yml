name: Release

"on":
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  APP_NAME: Tonica
  SCHEME: Tonica
  PROJECT_PATH: Tonica.xcodeproj
  DERIVED_DATA_PATH: .derived_ci
  NOTARY_KEYCHAIN_PROFILE: tonica-ci-notary
  SPARKLE_APPCAST_PATH: docs/appcast.xml

jobs:
  build-package:
    name: Build, Notarize & Publish
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select configured Xcode
        run: |
          RAW_CANDIDATES=()
          while IFS= read -r candidate; do
            RAW_CANDIDATES+=("$candidate")
          done < <(
            {
              xcode-select -p 2>/dev/null || true
              printf '%s\n' "/Applications/Xcode.app/Contents/Developer"
              printf '%s\n' "/Applications/Xcode-beta.app/Contents/Developer"
              find /Applications "$HOME/Applications" -maxdepth 2 -type d -name 'Xcode*.app' 2>/dev/null \
                | sed 's#$#/Contents/Developer#'
            } | awk 'NF && !seen[$0]++'
          )

          for candidate in "${RAW_CANDIDATES[@]}"; do
            [[ -d "$candidate" ]] || continue
            if VERSION_OUTPUT="$(DEVELOPER_DIR="$candidate" xcodebuild -version 2>/dev/null)"; then
              echo "Using Xcode at: $candidate"
              echo "$VERSION_OUTPUT"
              echo "DEVELOPER_DIR=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done

          echo "Could not find a usable Xcode installation." >&2
          exit 1

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate project
        run: xcodegen generate

      - name: Resolve version
        id: version
        run: |
          MARKETING_VERSION=$(grep -m1 'MARKETING_VERSION' Tonica.xcodeproj/project.pbxproj | sed 's/.*MARKETING_VERSION = //; s/;//; s/[[:space:]]//g')
          BUILD_NUMBER=$(grep -m1 'CURRENT_PROJECT_VERSION' Tonica.xcodeproj/project.pbxproj | sed 's/.*CURRENT_PROJECT_VERSION = //; s/;//; s/[[:space:]]//g')
          TAG="v${MARKETING_VERSION}"

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" != "$TAG" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match MARKETING_VERSION ${TAG}" >&2
            exit 1
          fi

          echo "MARKETING_VERSION=${MARKETING_VERSION}" >> "$GITHUB_OUTPUT"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/ci-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/developer_id.p12"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          USER_KEYCHAINS=()
          while IFS= read -r keychain; do
            USER_KEYCHAINS+=("$(printf '%s' "$keychain" | sed 's/^[[:space:]]*\"//; s/\"$//')")
          done < <(security list-keychains -d user)

          security list-keychains -d user -s "$KEYCHAIN_PATH" "${USER_KEYCHAINS[@]}"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Configure notarytool credentials
        env:
          APPLE_NOTARY_API_KEY_P8: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_API_KEY_P8" > "$API_KEY_PATH"

          store_args=(
            store-credentials
            "$NOTARY_KEYCHAIN_PROFILE"
            --key "$API_KEY_PATH"
            --key-id "$APPLE_NOTARY_KEY_ID"
            --keychain "$KEYCHAIN_PATH"
          )

          if [[ -n "${APPLE_NOTARY_ISSUER_ID:-}" ]]; then
            store_args+=(--issuer "$APPLE_NOTARY_ISSUER_ID")
          fi

          xcrun notarytool "${store_args[@]}"

          echo "APPLE_NOTARY_KEYCHAIN_PROFILE=$NOTARY_KEYCHAIN_PROFILE" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_IDENTITY }}
        run: |
          ARCHIVE_PATH="$RUNNER_TEMP/${APP_NAME}.xcarchive"
          XCRESULT_PATH="$RUNNER_TEMP/${APP_NAME}Archive.xcresult"

          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"
          echo "XCRESULT_PATH=$XCRESULT_PATH" >> "$GITHUB_ENV"

          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -resultBundlePath "$XCRESULT_PATH" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options runtime"

      - name: Export signed app
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_IDENTITY }}
        run: |
          EXPORT_PATH="$RUNNER_TEMP/export"
          echo "EXPORT_PATH=$EXPORT_PATH" >> "$GITHUB_ENV"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>developer-id</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>${SIGN_IDENTITY}</string>
              <key>stripSwiftSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          APP_PATH="${EXPORT_PATH}/${APP_NAME}.app"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          test -f "${APP_PATH}/Contents/MacOS/${APP_NAME}"

          codesign --force --deep --sign "$SIGN_IDENTITY" --timestamp --options runtime \
            --preserve-metadata=entitlements "$APP_PATH"

      - name: Verify app signature
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Notarize app bundle
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.MARKETING_VERSION }}
        run: |
          NOTARIZE_ZIP="$RUNNER_TEMP/${APP_NAME}-${MARKETING_VERSION}-notarize.zip"
          ditto -c -k --keepParent "$APP_PATH" "$NOTARIZE_ZIP"

          chmod +x ./scripts/notarize_archive.sh
          ./scripts/notarize_archive.sh "$NOTARIZE_ZIP"

          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type exec -vv "$APP_PATH"

      - name: Create DMG
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_IDENTITY }}
        run: |
          chmod +x ./scripts/build_dmg.sh
          DMG_PATH="$RUNNER_TEMP/Tonica.dmg"
          ./scripts/build_dmg.sh "$APP_PATH" "$DMG_PATH" "$APP_NAME"
          codesign --force --sign "$SIGN_IDENTITY" --timestamp --verbose=2 "$DMG_PATH"
          codesign --verify --verbose=2 "$DMG_PATH"

          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Notarize DMG
        run: |
          chmod +x ./scripts/notarize_archive.sh
          ./scripts/notarize_archive.sh "$DMG_PATH"

          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature -vv "$DMG_PATH"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.TAG }}
          MARKETING_VERSION: ${{ steps.version.outputs.MARKETING_VERSION }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES_FILE" <<EOF
          Tonica ${MARKETING_VERSION}

          Latest direct download:
          https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Tonica.dmg
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG_PATH#Tonica.dmg" --clobber
          else
            gh release create "$TAG" \
              "$DMG_PATH#Tonica.dmg" \
              --target "${GITHUB_SHA}" \
              --title "Tonica ${MARKETING_VERSION}" \
              --notes-file "$NOTES_FILE"
          fi

      - name: Generate Sparkle appcast
        env:
          TAG: ${{ steps.version.outputs.TAG }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          chmod +x ./scripts/generate_appcast.sh

          APPCAST_PATH="$RUNNER_TEMP/appcast.xml"
          ./scripts/generate_appcast.sh \
            "$DMG_PATH" \
            "$APPCAST_PATH" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
            "https://artoshi.work/tonica"

          echo "APPCAST_PATH=$APPCAST_PATH" >> "$GITHUB_ENV"

      - name: Publish Sparkle appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git checkout -B main origin/main

          mkdir -p "$(dirname "$SPARKLE_APPCAST_PATH")"
          cp "$APPCAST_PATH" "$SPARKLE_APPCAST_PATH"

          if git diff --quiet -- "$SPARKLE_APPCAST_PATH"; then
            echo "Sparkle appcast unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SPARKLE_APPCAST_PATH"
          git commit -m "Update Sparkle appcast for ${{ steps.version.outputs.TAG }}"
          git push origin HEAD:main

      - name: Verify latest release asset URL
        run: |
          curl --fail --silent --show-error --location --head \
            "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Tonica.dmg" \
            >/dev/null

      - name: Verify Sparkle appcast URL
        run: |
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/${SPARKLE_APPCAST_PATH}" \
            >/dev/null

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tonica-release-diagnostics
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ env.XCRESULT_PATH }}
            ${{ env.DMG_PATH }}

      - name: Delete temporary keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
